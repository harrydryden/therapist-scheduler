# Self-hosted / local production-like stack: the app image plus its own
# Postgres and Redis. (Production itself runs on Railway; see
# docs/PRODUCTION_DEPLOYMENT.md.)
#
# - Postgres and Redis are published on 127.0.0.1 only. Their defaults
#   (postgres/postgres, Redis without a password) are for local use; set
#   POSTGRES_PASSWORD and put Redis behind a password before exposing either.
# - The app talks to THESE services by default. Set DATABASE_URL / REDIS_URL
#   only to point it somewhere else.
# - SINGLE_INSTANCE_MODE defaults to false, the code default: distributed
#   locks are DENIED while Redis is unreachable, so two instances can never
#   both run a locked job. Set it to true only for a deploy you know is a
#   single instance (docs/PRODUCTION_DEPLOYMENT.md, "Distributed locking").

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-therapist_scheduling}}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-200}
      - SSE_MAX_CONNECTIONS=${SSE_MAX_CONNECTIONS:-100}
      - TOKEN_BUCKET_CAPACITY=${TOKEN_BUCKET_CAPACITY:-200}
      - TOKEN_BUCKET_REFILL_RATE=${TOKEN_BUCKET_REFILL_RATE:-20}
      - MAX_CONNECTIONS_PER_USER=${MAX_CONNECTIONS_PER_USER:-3}
      - MAX_TOTAL_CONNECTIONS=${MAX_TOTAL_CONNECTIONS:-50}
      - CONNECTION_TIMEOUT=${CONNECTION_TIMEOUT:-300000}
      - PERFORMANCE_MONITORING=${PERFORMANCE_MONITORING:-true}
      - PERFORMANCE_LOG_INTERVAL=${PERFORMANCE_LOG_INTERVAL:-300000}
      - PERFORMANCE_MAX_SAMPLES=${PERFORMANCE_MAX_SAMPLES:-100}
      - SLOW_QUERY_THRESHOLD=${SLOW_QUERY_THRESHOLD:-1000}
      - SLOW_MESSAGE_THRESHOLD=${SLOW_MESSAGE_THRESHOLD:-5000}
      - SLOW_AI_THRESHOLD=${SLOW_AI_THRESHOLD:-30000}
      - SINGLE_INSTANCE_MODE=${SINGLE_INSTANCE_MODE:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "packages/backend/dist/health-check.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-therapist_scheduling}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
